name: Release TouchController
on:
  push:
    tags:
      - "touchcontroller-*"

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MSYS_NO_PATHCONV: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      - name: Build
        run: bazel build --verbose_failures --config=opt --jobs=2 //touchcontroller:update_log //touchcontroller //touchcontroller/fabric //touchcontroller/neoforge

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          subject-path: |
            bazel-bin/touchcontroller/touchcontroller.jar
            bazel-bin/touchcontroller/fabric/fabric.jar
            bazel-bin/touchcontroller/neoforge/neoforge.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            bazel-bin/touchcontroller/update_log.md
            bazel-bin/touchcontroller/touchcontroller.jar
            bazel-bin/touchcontroller/fabric/fabric.jar
            bazel-bin/touchcontroller/neoforge/neoforge.jar

  publish-modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      MODRINTH_ID: ${{ vars.TOUCHCONTROLLER_MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-ubuntu-latest
          path: release

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      - name: Publish to Modrinth
        shell: bash
        run: |
          properties="$(bazel --quiet run --show_result=0 //rule/properties_extractor -- "$(realpath touchcontroller/properties.bzl)")"
          mod_version="$(jq -r .touchcontroller_version <<< "${properties}")"
          mod_state="$(jq -r .touchcontroller_state <<< "${properties}")"
          bazel run //rule/modrinth_uploader -- \
            --use-token-from-environment \
            --project-id "${MODRINTH_ID}" \
            --version-name "${mod_version}" \
            --version-id "${mod_version}+fabric" \
            --version-type "${mod_state}" \
            --loader fabric \
            --changelog "$(realpath release/update_log.md)" \
            --file-name "TouchController-${mod_version}+fabric.jar" \
            "$(realpath release/fabric/fabric.jar)" \
            $(jq -cr .touchcontroller_fabric_game_versions.[] <<< "${properties}" | sed 's/^/--game-version /' | tr '\n' ' ') \
            --dependency required:P7dR8mSH \
            --dependency required:Ha28R6CL \
            --dependency optional:mOgUt4GM && \
          bazel run //rule/modrinth_uploader -- \
            --use-token-from-environment \
            --project-id "${MODRINTH_ID}" \
            --version-name "${mod_version}" \
            --version-id "${mod_version}+neoforge" \
            --version-type "${mod_state}" \
            --loader neoforge \
            --changelog "$(realpath release/update_log.md)" \
            --file-name "TouchController-${mod_version}+neoforge.jar" \
            "$(realpath release/neoforge/neoforge.jar)" \
            $(jq -cr .touchcontroller_neoforge_game_versions.[] <<< "${properties}" | sed 's/^/--game-version /' | tr '\n' ' ') \
            --dependency required:ordsPcFz

  publish-curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      CURSEFORGE_ID: ${{ vars.TOUCHCONTROLLER_CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-ubuntu-latest
          path: release

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      - name: Publish to CurseForge
        shell: bash
        run: |
          properties="$(bazel --quiet run --show_result=0 //rule/properties_extractor -- "$(realpath touchcontroller/properties.bzl)")"
          mod_version="$(jq -r .touchcontroller_version <<< "${properties}")"
          mod_state="$(jq -r .touchcontroller_state <<< "${properties}")"
          mv release/fabric/fabric.jar "release/TouchController-${mod_version}+fabric.jar"
          mv release/neoforge/neoforge.jar "release/TouchController-${mod_version}+neoforge.jar"
          bazel run //rule/curseforge_uploader -- \
            --use-token-from-environment \
            --project-id "${CURSEFORGE_ID}" \
            --changelog "$(realpath release/update_log.md)" \
            --changelog-type markdown \
            --display-name "${mod_version}+fabric" \
            --release-type "${mod_state}" \
            --game-version modloader:fabric \
            --game-version java:java-21 \
            --game-version java:java-25 \
            $(jq -cr .touchcontroller_fabric_curseforge_game_versions.[] <<< "${properties}" | sed 's/^/--game-version /' | tr '\n' ' ') \
            --dependency fabric-api:306612:requiredDependency \
            --dependency fabric-language-kotlin:308769:requiredDependency \
            --dependency modmenu:308702:optionalDependency \
            --file "$(realpath "release/TouchController-${mod_version}+fabric.jar")" && \
          bazel run //rule/curseforge_uploader -- \
            --use-token-from-environment \
            --project-id "${CURSEFORGE_ID}" \
            --changelog "$(realpath release/update_log.md)" \
            --changelog-type markdown \
            --display-name "${mod_version}+neoforge" \
            --release-type "${mod_state}" \
            --game-version modloader:neoforge \
            --game-version java:java-21 \
            --game-version java:java-25 \
            $(jq -cr .touchcontroller_neoforge_curseforge_game_versions.[] <<< "${properties}" | sed 's/^/--game-version /' | tr '\n' ' ') \
            --dependency kotlin-for-forge:351264:requiredDependency \
            --file "$(realpath "release/TouchController-${mod_version}+neoforge.jar")"

  publish-github:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-ubuntu-latest
          path: release

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      - name: Move file and set environment variables
        shell: bash
        run: |
          properties="$(bazel --quiet run --show_result=0 //rule/properties_extractor -- "$(realpath touchcontroller/properties.bzl)")"
          mod_version="$(jq -r .touchcontroller_version <<< "${properties}")"
          mod_state="$(jq -r .touchcontroller_state <<< "${properties}")"
          echo "MOD_VERSION=${mod_version}" >> $GITHUB_ENV
          if [[ "$mod_state" == "release" ]]; then
            echo "MOD_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "MOD_PRERELEASE=true" >> $GITHUB_ENV
          fi
          mv release/touchcontroller.jar "release/TouchController-${mod_version}.jar"
          mv release/fabric/fabric.jar "release/TouchController-${mod_version}+fabric.jar"
          mv release/neoforge/neoforge.jar "release/TouchController-${mod_version}+neoforge.jar"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: TouchController v${{ env.MOD_VERSION }}
          draft: true
          body_path: release/update_log.md
          prerelease: ${{ env.MOD_PRERELEASE == 'true' }}
          files: |
            release/TouchController-*.jar
            release/TouchController-*+fabric.jar
            release/TouchController-*+neoforge.jar
