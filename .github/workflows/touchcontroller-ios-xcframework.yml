name: Build TouchController iOS XCFramework
on: [ pull_request, push ]

jobs:
  build:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: MODULE.bazel.lock
      - name: Setup Remote Cache
        uses: ./.github/actions/setup-bazel-cache
        with:
          host: ${{ vars.BAZEL_CACHE_HOST }}
          authorization: ${{ secrets.BAZEL_CACHE_AUTH }}
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}
      - name: Build
        run: |
          bazel build --verbose_failures --config=opt //touchcontroller/proxy/server/ios:ios_framework
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: touchcontroller_proxy.xcframework.zip
          archive: false
          path: bazel-bin/touchcontroller/proxy/server/ios/ios_framework.xcframework.zip
