name: Build ArmorStand and BlazeRod
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MSYS_NO_PATHCONV: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: MODULE.bazel.lock
      - name: Setup Remote Cache
        uses: ./.github/actions/setup-bazel-cache
        with:
          host: ${{ vars.BAZEL_CACHE_HOST }}
          authorization: ${{ secrets.BAZEL_CACHE_AUTH }}
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}
      - name: Build
        shell: bash
        run: |
          bazel build \
            --config=opt --verbose_failures \
            //armorstand:mod_fabric \
            //armorstand:mod_neoforge \
            //blazerod/model/model-base \
            //blazerod/model/model-formats \
            //blazerod/model/model-gltf \
            //blazerod/model/model-pmd \
            //blazerod/model/model-pmx \
            //blazerod/model/model-vmd \
            //blazerod/model/model-assimp:model-assimp-merged \
            //blazerod:blazerod_fabric_1_21_8 \
            //blazerod:blazerod_neoforge_1_21_8 \
            //blazerod/render/versions/1.21.8/fabric \
            //blazerod/render/versions/1.21.8/neoforge \
            //blazerod/example/ball_block
      - name: Test
        shell: bash
        if: runner.os != 'Windows'
        run: |
          bazel test \
            --verbose_failures \
            //blazerod/model:test \
            //blazerod/render/common/layout/test \
            //blazerod/render/versions/1.21.8/runtime/test
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            bazel-bin/armorstand/mod_fabric.jar
            bazel-bin/armorstand/mod_neoforge.jar
            bazel-bin/blazerod/model/model-base/model-base.jar
            bazel-bin/blazerod/model/model-formats/model-formats.jar
            bazel-bin/blazerod/model/model-gltf/model-gltf.jar
            bazel-bin/blazerod/model/model-pmd/model-pmd.jar
            bazel-bin/blazerod/model/model-pmx/model-pmx.jar
            bazel-bin/blazerod/model/model-vmd/model-vmd.jar
            bazel-bin/blazerod/model/model-assimp/model-assimp-merged.jar
            bazel-bin/blazerod/example/ball_block/ball_block.jar
            bazel-bin/blazerod/blazerod_fabric_1_21_8.jar
            bazel-bin/blazerod/blazerod_neoforge_1_21_8.jar
            bazel-bin/blazerod/render/versions/1.21.8/fabric/remapped_fabric.jar
